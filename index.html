<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>アセット×変化 カードゲーム</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=BIZ+UDGothic:wght@400;700&display=swap">
<style>
/* ===== STNet アセット×変化 カードゲーム v2 ===== */
:root{
  color-scheme: light;
  --paper:#ffffff; --paper2:#f6f8fb; --paper3:#eceff4; --line:#e3e8ee; --line2:#c9d1db;
  --ink:#16202b; --ink2:#4a5664; --ink3:#8590a0;
  --blue:#2962ff; --blue-ink:#1b46c2; --blue-soft:#e9efff; --blue-line:#b9c9ff;
  --red:#e2323f; --red-ink:#b81e2a; --red-soft:#fdeaec;
  --hl:#fff176;
  --corp:#1e4fa3; --corp-soft:#e6edf9;
  --cons:#f26b1d; --cons-soft:#fff0e6;
  --common:#6f4bd8; --common-soft:#f0ebfc;
  --pop:#e2323f; --soc:#ef9f1a; --tech:#1e88e5; --nat:#2e9e5b;
  --ok:#1f9d55; --ok-soft:#e5f6ec;
  --shadow-sm:0 1px 2px rgba(22,32,43,.05),0 2px 8px rgba(22,32,43,.05);
  --shadow-md:0 8px 24px rgba(22,32,43,.10);
  --shadow-lg:0 20px 60px rgba(22,32,43,.16);
  --font:'BIZ UDPGothic','BIZ UDGothic','Hiragino Sans','Yu Gothic UI','Meiryo',sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
  --spring:cubic-bezier(.34,1.56,.64,1);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased;overflow-x:hidden}
h1,h2,h3,h4{margin:0;line-height:1.3}
p{margin:0}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;margin:0}
input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
input:focus-visible,textarea:focus-visible,button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--blue-line);outline-offset:2px}
a{color:var(--blue-ink)}
::selection{background:var(--hl)}
.tnum{font-variant-numeric:tabular-nums}
.hl{background:linear-gradient(var(--hl),var(--hl));background-size:100% 1.2em;background-position:0 0;background-repeat:no-repeat;padding:0 .12em;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.muted{color:var(--ink3)}
.small{font-size:12.5px}
[hidden]{display:none!important}

/* ---------- app frame ---------- */
#app{min-height:100vh;display:flex;flex-direction:column;background:var(--paper)}
.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:14px;padding:10px 24px;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand svg{flex:none}
.brand b{display:block;font-size:16px;letter-spacing:.02em;line-height:1.15}
.brand small{display:block;font-size:11.5px;color:var(--ink3);line-height:1.2;margin-top:2px}
.topbar .spacer{flex:1}
.syncbadge{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:12.5px;font-weight:700;color:var(--ink2)}
.syncbadge .dot{width:9px;height:9px;border-radius:50%;background:var(--line2)}
.syncbadge.on .dot{background:var(--ok);box-shadow:0 0 0 3px var(--ok-soft)}
.syncbadge.connecting .dot{background:#f5b301;animation:blink 1s steps(2) infinite}
.syncbadge.error .dot,.syncbadge.unsupported .dot{background:var(--red)}
.syncbadge.busy .dot{background:#f5b301}
.teamswitch{display:flex;gap:4px;align-items:center;background:var(--paper2);padding:4px;border-radius:999px;border:1px solid var(--line)}
.teamswitch button{padding:5px 13px;border-radius:999px;font-weight:700;font-size:13px;color:var(--ink2);transition:all .2s var(--ease)}
.teamswitch button.on{background:var(--ink);color:#fff;box-shadow:var(--shadow-sm)}
.timer{display:flex;align-items:center;gap:8px;padding:4px 6px 4px 12px;border:1px solid var(--line);border-radius:999px;background:var(--paper2)}
.timer .t{font-weight:700;font-size:18px;min-width:64px;text-align:center;letter-spacing:.02em}
.timer.running .t{color:var(--blue-ink)}
.timer.over .t{color:var(--red);animation:blink 1s steps(2) infinite}
.timer button{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#fff;border:1px solid var(--line);font-weight:700}
.timer button:hover{background:var(--blue-soft);border-color:var(--blue-line)}
.iconbtn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);background:#fff;transition:all .2s;flex:none}
.iconbtn:hover{background:var(--paper2)}
@keyframes blink{50%{opacity:.35}}

/* stepper */
.stepper{display:flex;gap:4px;padding:10px 24px;overflow-x:auto;border-bottom:1px solid var(--line);background:var(--paper);scrollbar-width:none}
.stepper::-webkit-scrollbar{display:none}
.step{flex:1;min-width:104px;display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:12px;border:1.5px solid transparent;color:var(--ink3);transition:all .25s var(--ease);position:relative;text-align:left}
.step .n{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:12.5px;background:var(--paper3);color:var(--ink2);flex:none;transition:all .25s}
.step .l{font-weight:700;font-size:13.5px;line-height:1.2;white-space:nowrap}
.step .s{font-size:10.5px;line-height:1.2;display:block;font-weight:400;opacity:.85}
.step:hover{background:var(--paper2);color:var(--ink2)}
.step.done{color:var(--ink2)}
.step.done .n{background:var(--ok-soft);color:var(--ok)}
.step.on{background:var(--ink);color:#fff;border-color:var(--ink);box-shadow:var(--shadow-sm)}
.step.on .n{background:var(--hl);color:var(--ink)}
.step .badge{position:absolute;top:-6px;right:-4px;background:var(--red);color:#fff;font-size:10.5px;font-weight:700;border-radius:999px;padding:1px 7px;box-shadow:var(--shadow-sm)}

#stage{flex:1;width:100%;max-width:1280px;margin:0 auto;padding:36px 28px 130px}
.actionbar{position:fixed;bottom:0;left:0;right:0;z-index:35;display:flex;align-items:center;gap:10px;padding:12px 24px;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-top:1px solid var(--line)}
.actionbar .hint{flex:1;color:var(--ink3);font-size:13.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center}
.actionbar .hint b{background:var(--hl);padding:0 4px;color:var(--ink)}

/* buttons */
.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 18px;border-radius:999px;font-weight:700;font-size:14.5px;border:1.5px solid var(--line2);background:#fff;color:var(--ink);transition:transform .15s var(--spring),box-shadow .2s,background .2s,border-color .2s;white-space:nowrap;line-height:1.2}
.btn:hover{transform:translateY(-1px);box-shadow:var(--shadow-sm);border-color:var(--ink3)}
.btn:active{transform:translateY(0) scale(.98)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 6px 16px rgba(41,98,255,.25)}
.btn.primary:hover{background:var(--blue-ink);border-color:var(--blue-ink)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.red{background:var(--red);border-color:var(--red);color:#fff;box-shadow:0 6px 16px rgba(226,50,63,.22)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink2)}
.btn.ghost:hover{background:var(--paper2);box-shadow:none}
.btn.warn{color:var(--red-ink);border-color:#f3c1c6;background:#fff}
.btn.warn:hover{background:var(--red-soft)}
.btn.sm{padding:6px 12px;font-size:13px}
.btn.lg{padding:14px 28px;font-size:17px}
.btn.xl{padding:18px 36px;font-size:20px}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}
.btn .k{font-size:11px;opacity:.7;border:1px solid currentColor;border-radius:4px;padding:0 4px;margin-left:2px}

/* generic layout */
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:26px;flex-wrap:wrap}
.pagehead h2{font-size:27px;letter-spacing:.01em;display:flex;align-items:center;gap:12px}
.pagehead h2 .num{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:50%;background:var(--ink);color:var(--hl);font-size:16px;flex:none}
.pagehead p{color:var(--ink2);margin-top:8px;max-width:60ch;font-size:15px}
.pagehead .tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px 24px}
.panel.tint{background:var(--paper2);border-color:transparent}
.panel.focus{border:2px solid var(--ink)}
.panel h3{font-size:16px;margin-bottom:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--paper3);color:var(--ink2);line-height:1.5;white-space:nowrap}
.tag.corp{background:var(--corp-soft);color:var(--corp)}
.tag.cons{background:var(--cons-soft);color:#c2500a}
.tag.common{background:var(--common-soft);color:var(--common)}
.tag.pop{background:#fdeaec;color:#b81e2a}
.tag.soc{background:#fff4de;color:#a86a00}
.tag.tech{background:#e4f1fd;color:#0d5ea8}
.tag.nat{background:#e4f5eb;color:#1d7a43}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.dot::before{content:'';width:8px;height:8px;border-radius:50%;background:currentColor}
.empty{border:2px dashed var(--line2);border-radius:18px;padding:40px 20px;text-align:center;color:var(--ink3)}
.empty b{display:block;color:var(--ink2);font-size:16px;margin-bottom:6px}
.note{background:var(--hl);border-radius:12px;padding:12px 16px;font-size:14px;margin-bottom:18px;color:var(--ink)}
.inrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.input{padding:10px 14px;border:1.5px solid var(--line2);border-radius:10px;background:#fff;min-width:0;transition:border-color .2s,box-shadow .2s}
.input:focus{border-color:var(--blue);box-shadow:0 0 0 4px var(--blue-soft);outline:none}
.input.big{font-size:19px;font-weight:700;padding:14px 18px;border-radius:14px}
.seg{display:inline-flex;background:var(--paper3);border-radius:999px;padding:3px;gap:2px}
.seg button{padding:6px 14px;border-radius:999px;font-weight:700;font-size:13px;color:var(--ink2);transition:all .2s;white-space:nowrap}
.seg button.on{background:#fff;color:var(--ink);box-shadow:var(--shadow-sm)}
.seg button.on.corp{color:var(--corp)} .seg button.on.cons{color:#c2500a} .seg button.on.common{color:var(--common)}
.seg.lg button{padding:10px 18px;font-size:15px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px 4px 5px;border-radius:999px;border:1.5px solid var(--line);font-weight:700;font-size:13px;background:#fff;transition:all .15s}
.chip .av{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:10.5px}
.chip.on{border-color:var(--ink);box-shadow:0 0 0 3px var(--hl)}
.chip.dashed{border-style:dashed;padding:4px 12px}
.chip:hover{transform:translateY(-1px)}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-weight:700;font-size:13.5px;color:var(--ink2);display:flex;justify-content:space-between;align-items:baseline}
.field label small{font-weight:400;color:var(--ink3)}
.field textarea{padding:12px 14px;border:1.5px solid var(--line2);border-radius:12px;min-height:74px;resize:vertical;line-height:1.55;background:#fff}
.field textarea:focus{border-color:var(--blue);box-shadow:0 0 0 4px var(--blue-soft);outline:none}
.pasteArea{width:100%;min-height:120px;padding:12px;border:1.5px dashed var(--line2);border-radius:12px;background:var(--paper2);resize:vertical}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}

/* ---------- home ---------- */
.intro{padding:24px 0 12px;max-width:820px}
.intro .eyebrow{font-size:13px;letter-spacing:.14em;color:var(--ink3);font-weight:700;margin-bottom:12px}
.intro h1{font-size:clamp(26px,3.4vw,40px);line-height:1.25;letter-spacing:.01em}
.intro h1 .x{display:inline-block;color:var(--red);margin:0 .12em}
.intro p{font-size:16px;color:var(--ink2);margin:16px 0 24px;max-width:52ch}
.intro .cta{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.flow{display:grid;grid-template-columns:repeat(8,1fr);gap:10px;margin:36px 0 28px}
.flow .f{position:relative;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:14px 12px 12px;text-align:left;transition:all .2s var(--ease);min-height:126px;display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start}
.flow .f:hover{transform:translateY(-3px);box-shadow:var(--shadow-md);border-color:var(--ink)}
.flow .f .n{font-size:10.5px;font-weight:700;color:var(--ink3);letter-spacing:.1em}
.flow .f .ic{height:34px;display:flex;align-items:center;margin:6px 0 4px}
.flow .f b{display:block;font-size:14px;line-height:1.25}
.flow .f span{display:block;font-size:11px;color:var(--ink3);margin-top:4px;line-height:1.35}
.statusrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding-top:18px;border-top:1px solid var(--line)}

/* ---------- team ---------- */
.teamgrid{display:grid;grid-template-columns:1fr 1.3fr;gap:18px;margin-bottom:18px}
.members{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.member{display:inline-flex;align-items:center;gap:8px;padding:6px 8px 6px 6px;border-radius:999px;border:1.5px solid var(--line);background:#fff;font-weight:700;font-size:14px;animation:pop .4s var(--spring);cursor:pointer}
.member .av{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:12px;font-weight:700}
.member .dp{font-size:11px;color:var(--ink3);font-weight:400}
.member .x,.member .mv{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:var(--ink3);font-size:14px}
.member .x:hover{background:var(--red-soft);color:var(--red)}
.member .mv:hover{background:var(--blue-soft);color:var(--blue-ink)}
.member.fac{border-style:dashed;opacity:.8}
.teamcols{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.teamcol{border:1.5px solid var(--line);border-radius:14px;padding:12px 12px 10px;background:#fff;display:flex;flex-direction:column;gap:6px;min-height:150px}
.teamcol.on{border-color:var(--ink)}
.teamcol .th{display:flex;align-items:center;gap:6px}
.teamcol .tname{flex:1;min-width:0;font-weight:700;font-size:15px;border:0;border-bottom:1.5px dashed var(--line2);padding:2px 4px;background:transparent}
.teamcol .tname:focus{outline:none;border-color:var(--blue)}
.teamcol .cnt{font-size:12px;color:var(--ink3)}
.teamcol .x{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:var(--ink3)}
.teamcol .x:hover{background:var(--red-soft);color:var(--red)}
.teamcol .members{margin:4px 0;flex:1;align-content:flex-start}
.teamcol .member{font-size:13px;padding:4px 6px 4px 4px;white-space:nowrap}
.teamcol .member .av{width:22px;height:22px;font-size:11px}
.room .rh{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.room .rh h3{margin:0}
.room .code{font-size:22px;letter-spacing:.2em;background:var(--ink);color:var(--hl);padding:2px 12px;border-radius:8px;margin-left:4px}
.room .st{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink2)}
.room .dot{width:10px;height:10px;border-radius:50%;background:#f5b301;display:inline-block}
.room .dot.on{background:var(--ok)} .room .dot.ng{background:var(--red)} .room .dot.wait{background:#f5b301}
.room .roombody{display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap}
.room .qr{background:#fff;padding:8px;border-radius:12px;border:1px solid var(--line);line-height:0}
.warn-note{color:var(--ink2);font-size:12.5px}

/* ---------- cards ---------- */
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;align-content:start}
.card{position:relative;background:#fff;border:2px solid var(--ink);border-radius:14px;padding:16px 16px 14px;min-height:138px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow-sm);transition:transform .25s var(--spring),box-shadow .25s,border-color .2s,opacity .3s;user-select:none;-webkit-user-select:none}
.card.in{animation:dealin .55s var(--spring) both}
@keyframes dealin{0%{transform:translateY(40px) rotate(-6deg) scale(.7);opacity:0}100%{transform:none;opacity:1}}
.card .top{display:flex;justify-content:space-between;align-items:center;gap:6px}
.card .txt{font-size:16.5px;font-weight:700;line-height:1.35;flex:1;display:flex;align-items:center;word-break:break-word;overflow-wrap:anywhere}
.card .foot{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink3);min-height:18px}
.card .foot .av{width:16px;height:16px;border-radius:50%;flex:none}
.card .merged{display:inline-flex;align-items:center;gap:4px;background:var(--ink);color:var(--hl);font-size:11px;font-weight:700;padding:1px 8px;border-radius:999px}
.card .ctl{position:absolute;right:8px;bottom:8px;display:flex;gap:4px;opacity:0;transition:opacity .2s}
.card:hover .ctl,.card:focus-within .ctl{opacity:1}
.card .ic{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:var(--ink3);background:#fff;border:1px solid var(--line);font-size:14px}
.card .ic:hover{color:var(--ink);border-color:var(--ink)}
.card .ic.del:hover{color:var(--red);border-color:var(--red);background:var(--red-soft)}
.card.sel{border-color:var(--blue);box-shadow:0 0 0 4px var(--blue-soft),var(--shadow-md);transform:translateY(-4px)}
.card.sel::after{content:'✓';position:absolute;top:-10px;left:-10px;width:26px;height:26px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px;box-shadow:var(--shadow-sm)}
.card.dragging{opacity:.5;transform:scale(.96)}
.card.dropt{border-color:var(--blue);background:var(--blue-soft);transform:scale(1.04)}
.card.fuse{animation:fuse .6s var(--ease)}
@keyframes fuse{0%{transform:scale(1)}40%{transform:scale(1.12);box-shadow:0 0 0 8px var(--hl)}100%{transform:scale(1)}}
.card.out{animation:out .3s var(--ease) forwards}
@keyframes out{to{transform:scale(.4) rotate(8deg);opacity:0}}
.card.pickable{cursor:pointer}
.card.pickable:hover{transform:translateY(-4px);box-shadow:var(--shadow-md)}
.card.corp{border-color:var(--corp)} .card.cons{border-color:var(--cons)} .card.common{border-color:var(--common)}
.card::before{content:'';position:absolute;left:12px;right:12px;top:-2px;height:4px;border-radius:0 0 4px 4px;background:var(--ink)}
.card.corp::before{background:var(--corp)} .card.cons::before{background:var(--cons)} .card.common::before{background:var(--common)}

/* change card */
.ccard{position:relative;background:#fff;border:3px solid var(--red);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow-sm);transition:transform .25s var(--spring),box-shadow .25s;text-align:left}
.ccard .ph{height:110px;background:var(--paper3);position:relative;overflow:hidden}
.ccard .ph img{width:100%;height:100%;object-fit:cover;display:block}
.ccard .ph .tag{position:absolute;left:10px;top:10px;background:#fff;box-shadow:var(--shadow-sm)}
.ccard .body{padding:14px 16px 14px;display:flex;flex-direction:column;gap:8px;flex:1}
.ccard .ttl{font-size:17px;font-weight:700;line-height:1.3}
.ccard .sum{font-size:12.5px;color:var(--ink2);line-height:1.55}
.ccard .shk{font-size:11.5px;color:var(--ink2);background:var(--paper2);border-radius:8px;padding:7px 9px;line-height:1.45;margin-top:auto}
.ccard .shk b{color:var(--red-ink)}
.ccard.sel{box-shadow:0 0 0 4px var(--hl),var(--shadow-md);transform:translateY(-4px)}
.ccard.mini .ph{height:64px}
.ccard.mini .ttl{font-size:14.5px}
.ccard.mini .sum,.ccard.mini .shk{display:none}
.ccard.big{border-width:4px;border-radius:22px}
.ccard.big .ph{height:170px}
.ccard.big .ttl{font-size:23px}
.ccard.big .sum{font-size:14.5px}
.ccard.big .shk{font-size:13px}
.ccard .id{position:absolute;right:10px;top:10px;background:rgba(255,255,255,.9);font-size:11px;font-weight:700;padding:1px 7px;border-radius:6px;color:var(--ink2)}

/* deck + flip */
.deckarea{display:grid;grid-template-columns:250px 1fr;gap:32px;align-items:start}
.deckcol{display:flex;flex-direction:column;align-items:center;gap:14px}
.deck{position:relative;width:200px;height:272px;margin:8px auto 30px;perspective:1200px}
.deck .b{position:absolute;inset:0;border-radius:16px;border:2px solid #0d1620;background:repeating-linear-gradient(135deg,rgba(255,255,255,.06) 0 6px,transparent 6px 14px),linear-gradient(160deg,#1f2c3b,#0f1721);box-shadow:var(--shadow-md)}
.deck .b:nth-child(1){transform:translate(8px,10px) rotate(3deg)}
.deck .b:nth-child(2){transform:translate(4px,5px) rotate(1.5deg)}
.deck .b .m{position:absolute;inset:0;display:grid;place-items:center;color:#fff}
.deck .b .m b{font-size:18px;letter-spacing:.2em;writing-mode:vertical-rl;color:rgba(255,255,255,.85)}
.deck.red .b{border-color:#8a1220;background:repeating-linear-gradient(135deg,rgba(255,255,255,.07) 0 6px,transparent 6px 14px),radial-gradient(circle at 30% 20%,#ff6b76,#b81e2a 60%,#8a1220)}
.deck.shuffle .b:nth-child(1){animation:sh1 .8s var(--ease) infinite}
.deck.shuffle .b:nth-child(2){animation:sh2 .8s var(--ease) infinite}
.deck.shuffle .b:nth-child(3){animation:sh3 .8s var(--ease) infinite}
@keyframes sh1{0%,100%{transform:translate(8px,10px) rotate(3deg)}50%{transform:translate(-70px,-10px) rotate(-12deg)}}
@keyframes sh2{0%,100%{transform:translate(4px,5px) rotate(1.5deg)}50%{transform:translate(70px,6px) rotate(10deg)}}
@keyframes sh3{0%,100%{transform:none}50%{transform:translate(0,-30px) rotate(2deg)}}
.deck .cnt{position:absolute;bottom:-28px;left:0;right:0;text-align:center;font-size:12.5px;color:var(--ink3);white-space:nowrap}
.hand{display:flex;gap:20px;flex-wrap:wrap;justify-content:center;align-items:stretch}
.slot{width:232px;min-height:300px;perspective:1400px;position:relative}
.slot.wide{width:min(440px,100%)}
.slot .flip{position:relative;width:100%;height:100%;min-height:300px;transform-style:preserve-3d;transition:transform .8s var(--ease)}
.slot .flip.back{transform:rotateY(180deg)}
.slot .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.slot .face.b{transform:rotateY(180deg)}
.slot .phold{border:2px dashed var(--line2);border-radius:16px;height:100%;min-height:300px;display:grid;place-items:center;color:var(--ink3);text-align:center;font-size:14px;line-height:1.5;padding:16px}
.slot .phold.red{border-color:#f3c1c6}
.slot .phold .n{width:44px;height:44px;border-radius:50%;background:var(--paper3);display:grid;place-items:center;font-weight:700;font-size:18px;color:var(--ink2);margin:0 auto 8px}
.slot .phold.red .n{background:var(--red-soft);color:var(--red)}
.slot .backface{height:100%;min-height:300px;border-radius:16px;border:2px solid #0d1620;background:repeating-linear-gradient(135deg,rgba(255,255,255,.06) 0 6px,transparent 6px 14px),linear-gradient(160deg,#1f2c3b,#0f1721);box-shadow:var(--shadow-md)}
.slot .backface.red{border-color:#8a1220;background:repeating-linear-gradient(135deg,rgba(255,255,255,.07) 0 6px,transparent 6px 14px),radial-gradient(circle at 30% 20%,#ff6b76,#b81e2a 60%,#8a1220)}
.slot .card{height:100%;min-height:300px;padding:18px 16px 14px}
.slot .card .txt{font-size:21px;justify-content:center;text-align:center}
.slot .ccard{height:100%;min-height:300px}
.slot .redraw{position:absolute;bottom:-40px;left:50%;transform:translateX(-50%);white-space:nowrap;display:flex;gap:8px}
.slot.landed{animation:land .5s var(--spring)}
@keyframes land{0%{transform:translateY(-30px) scale(1.05)}100%{transform:none}}
.slot .rm{position:absolute;top:-10px;right:-10px;z-index:3;width:28px;height:28px;border-radius:50%;background:#fff;border:1.5px solid var(--line2);display:grid;place-items:center;color:var(--ink2);box-shadow:var(--shadow-sm)}
.slot .rm:hover{color:var(--red);border-color:var(--red)}
.chgslot{display:flex;justify-content:center;padding-bottom:50px}
.yakuwrap{text-align:center;margin-top:56px}
.yaku{display:inline-flex;align-items:center;gap:10px;padding:8px 16px;border-radius:999px;background:var(--ink);color:#fff;font-weight:700;animation:pop .5s var(--spring)}
.yaku .y{background:var(--hl);color:var(--ink);padding:0 8px;border-radius:6px}
.yaku.soft{background:var(--paper3);color:var(--ink2)}
.yaku.soft .y{background:#fff}

/* table summary strip */
.table{display:flex;gap:10px;align-items:stretch;flex-wrap:wrap;padding:14px;border-radius:18px;background:var(--paper2);margin-bottom:22px}
.table .mini{width:168px;min-height:92px;border:2px solid var(--ink);border-radius:12px;background:#fff;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.table .mini .txt{font-weight:700;font-size:14px;line-height:1.3;flex:1;display:flex;align-items:center}
.table .mini.corp{border-color:var(--corp)} .table .mini.cons{border-color:var(--cons)} .table .mini.common{border-color:var(--common)}
.table .mini.empty{border-style:dashed;border-color:var(--line2);color:var(--ink3);justify-content:center;align-items:center;text-align:center;font-size:12.5px}
.table .op,.table .eq{display:grid;place-items:center;font-size:24px;font-weight:700;color:var(--ink3);width:24px}
.table .mini.chg{border:3px solid var(--red);width:228px}
.table .mini.chg.empty{border-color:#f3c1c6}
.table .goal{flex:1;min-width:180px;display:flex;flex-direction:column;justify-content:center;gap:2px;padding:6px 12px}
.table .goal b{font-size:15px}
.table .goal span{font-size:12.5px;color:var(--ink2)}

/* ---------- write ---------- */
.inputbar{background:#fff;border:2px solid var(--ink);border-radius:20px;padding:16px 18px;box-shadow:var(--shadow-md);display:flex;flex-direction:column;gap:12px;margin-bottom:22px}
.inputbar .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.inputbar .row .input{flex:1;min-width:240px}
.inputbar .who{gap:6px}
.inputbar .who .lab{font-size:12.5px;color:var(--ink3);font-weight:700;margin-right:4px}
.stats{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin:0 0 16px;font-size:13.5px;color:var(--ink2)}
.stats .num{font-size:28px;font-weight:700;color:var(--ink);letter-spacing:.02em}
.suggest{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.suggest button{font-size:12.5px;padding:4px 10px;border-radius:999px;border:1px dashed var(--line2);color:var(--ink2);background:#fff}
.suggest button:hover{border-color:var(--ink);color:var(--ink)}

/* ---------- merge ---------- */
.simlist{display:flex;flex-direction:column;gap:8px}
.sim{display:grid;grid-template-columns:1fr auto 1fr auto;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#fff}
.sim .t{font-weight:700;font-size:14px;line-height:1.3}
.sim .t small{display:block;font-weight:400;color:var(--ink3);font-size:11.5px}
.sim .pct{font-size:12px;color:var(--ink3);text-align:center}
.mergebar{position:sticky;bottom:78px;z-index:30;display:flex;gap:10px;align-items:center;justify-content:center;padding:10px 16px;border-radius:999px;background:var(--ink);color:#fff;box-shadow:var(--shadow-lg);width:max-content;margin:16px auto 0;animation:pop .35s var(--spring)}
.mergebar b{color:var(--hl)}
.groupwrap{display:flex;flex-direction:column;gap:26px}
.grouphead{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-weight:700}
.grouphead .cnt{font-size:12.5px;color:var(--ink3);font-weight:400}
.hiddenchildren{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.hiddenchildren .c{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;padding:6px 10px;border-radius:8px;background:var(--paper2)}

/* ---------- draw / change ---------- */
.pickgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.pickgrid .card{min-height:120px}
.pickgrid .card .txt{font-size:15px}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.cgrid .ccard{cursor:pointer}
.cgrid .ccard:hover{transform:translateY(-4px);box-shadow:var(--shadow-md)}
.catdecks{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin:0 0 26px}
.catdeck{position:relative;border-radius:16px;overflow:hidden;border:2px solid var(--line);background:#fff;text-align:left;transition:all .2s var(--ease);display:flex;flex-direction:column}
.catdeck img{width:100%;height:84px;object-fit:cover;display:block}
.catdeck .b{padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.catdeck .b b{font-size:15px}
.catdeck .b span{font-size:11.5px;color:var(--ink3)}
.catdeck:hover{transform:translateY(-3px);box-shadow:var(--shadow-md);border-color:var(--ink)}
.catdeck.on{border-color:var(--red);box-shadow:0 0 0 3px var(--hl)}
.catdeck.off{opacity:.4}
.catdeck .swatch{position:absolute;left:0;top:0;bottom:0;width:6px}
.roulette{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:8px 0 12px;max-width:260px}
.roulette .r{padding:6px 12px;border-radius:999px;border:2px solid var(--line);font-weight:700;font-size:13px;color:var(--ink2);transition:all .1s}
.roulette .r.on{border-color:var(--red);background:var(--red);color:#fff;transform:scale(1.08)}

/* ---------- news ---------- */
.kwrow{display:flex;flex-direction:column;gap:6px;margin-bottom:22px}
.kwchips{display:flex;gap:6px;flex-wrap:wrap}
.kwchips .tag{cursor:pointer;text-decoration:line-through;opacity:.6}
.kwchips .tag.on{background:var(--ink);color:var(--hl);text-decoration:none;opacity:1}
.newssec{margin-bottom:26px}
.newssec h3{font-size:16px;margin-bottom:10px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.newsgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.news{display:flex;flex-direction:column;gap:8px;padding:16px 18px;border:1px solid var(--line);border-radius:16px;background:#fff;text-decoration:none;color:inherit;transition:all .2s var(--ease);animation:dealin .5s var(--spring) both;min-height:140px}
.news:hover{transform:translateY(-3px);box-shadow:var(--shadow-md);border-color:var(--ink)}
.news .src{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--ink3)}
.news .src b{color:var(--ink2)}
.news .t{font-weight:700;font-size:15px;line-height:1.45;flex:1}
.news .why{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.news .why .tag{font-size:10.5px}
.searchrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.searchrow .input{flex:1;min-width:220px}

/* ---------- idea ---------- */
.ideaform{display:grid;grid-template-columns:1.15fr .85fr;gap:20px;align-items:start}
.ideaform .side{display:flex;flex-direction:column;gap:16px}
.frame4{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.frame4 .field{margin:0 0 14px}
.crit{display:flex;flex-direction:column;gap:8px}
.crit .c{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:13.5px}
.crit .c .stars{display:flex;gap:2px}
.crit .c .stars button{font-size:20px;color:var(--line2);transition:transform .15s var(--spring),color .15s;line-height:1}
.crit .c .stars button.on{color:#f5b301}
.crit .c .stars button:hover{transform:scale(1.25)}
.idealist{display:flex;flex-direction:column;gap:8px}
.ideaitem{display:grid;grid-template-columns:1fr;gap:6px;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:#fff;text-align:left;transition:all .2s}
.ideaitem:hover{border-color:var(--ink);box-shadow:var(--shadow-sm)}
.ideaitem.on{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}
.ideaitem b{font-size:15px}
.ideaitem .sub{font-size:12px;color:var(--ink3);display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.ideaitem .sub span{background:var(--paper3);padding:0 6px;border-radius:5px}
.aipanel{border:2px solid var(--ink)}
.aipanel .rh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.aipanel .rh h3{margin:0 0 8px}
.prompts{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.prompts button{font-size:12.5px;padding:5px 11px;border-radius:999px;border:1px solid var(--line2);background:#fff;color:var(--ink2)}
.prompts button:hover{border-color:var(--ink);color:var(--ink)}
.chatlog{max-height:360px;overflow:auto;display:flex;flex-direction:column;gap:8px;padding:4px 2px}
.msg{padding:10px 12px;border-radius:12px;font-size:13.5px;line-height:1.6}
.msg.user{background:var(--paper3);align-self:flex-end;max-width:90%;font-weight:700}
.msg.assistant{background:var(--paper2);border:1px solid var(--line)}
.msg.assistant.thinking{color:var(--ink3);animation:blink 1.2s steps(2) infinite}
.msg p{margin:0 0 6px} .msg p:last-child{margin:0}
.msg ul{margin:4px 0 6px;padding-left:20px}
.msg h4{font-size:13.5px;margin:6px 0 4px}
.msg code{background:#fff;padding:0 4px;border-radius:4px;font-size:12px}

/* ---------- presentation ---------- */
.presbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.present{display:grid;grid-template-columns:1fr;gap:16px}
.slide{position:relative;background:#fff;border:1px solid var(--line);border-radius:24px;padding:36px 42px;box-shadow:var(--shadow-md);min-height:540px;display:grid;grid-template-columns:1fr 1.15fr;gap:36px;overflow:hidden}
.slide .l{display:flex;flex-direction:column;gap:14px}
.slide .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.slide .cards .mini{border:2px solid var(--ink);border-radius:12px;background:#fff;padding:12px;min-height:120px;display:flex;flex-direction:column;gap:6px;animation:dealin .6s var(--spring) both}
.slide .cards .mini:nth-child(2){animation-delay:.1s}.slide .cards .mini:nth-child(3){animation-delay:.2s}
.slide .cards .mini .txt{font-weight:700;font-size:15px;line-height:1.3;flex:1;display:flex;align-items:center}
.slide .cards .mini.corp{border-color:var(--corp)}.slide .cards .mini.cons{border-color:var(--cons)}.slide .cards .mini.common{border-color:var(--common)}
.slide .chg{animation:dealin .6s .3s var(--spring) both}
.slide .arrow{text-align:center;font-size:30px;color:var(--ink3);line-height:1}
.slide .r{display:flex;flex-direction:column;gap:18px;justify-content:center}
.slide .eyebrow{font-size:12.5px;letter-spacing:.14em;color:var(--ink3);font-weight:700}
.slide h2{font-size:38px;line-height:1.25}
.slide .one{font-size:20px;color:var(--ink2);line-height:1.6}
.slide .kv{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:15.5px}
.slide .kv b{color:var(--ink3);font-size:12.5px;padding-top:3px;white-space:nowrap}
.slide .kv.crits{font-size:13px}
.slide .stars{color:#f5b301;font-size:16px;letter-spacing:.05em}
.slide .stars .dim{color:var(--line2)}
.slide .team{position:absolute;right:26px;top:22px;display:flex;gap:8px;align-items:center;font-size:13px;color:var(--ink3)}
.slide .team .av{width:26px;height:26px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:700;font-size:12px}
.slide .pageno{position:absolute;right:26px;bottom:18px;font-size:12px;color:var(--ink3)}
.slide.enter{animation:slidein .5s var(--ease)}
@keyframes slidein{0%{transform:translateX(40px);opacity:0}100%{transform:none;opacity:1}}
.pnav{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
.pnav .dots{display:flex;gap:6px}
.pnav .dots button{width:10px;height:10px;border-radius:50%;background:var(--line2);transition:all .2s}
.pnav .dots button.on{background:var(--ink);transform:scale(1.3)}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.gitem{border:1.5px solid var(--line);border-radius:16px;padding:16px;background:#fff;text-align:left;transition:all .2s;display:flex;flex-direction:column;gap:8px}
.gitem:hover{border-color:var(--ink);box-shadow:var(--shadow-md);transform:translateY(-3px)}
.gitem .tm{font-size:12px;color:var(--ink3);font-weight:700}
.gitem b{font-size:17px;line-height:1.3}
.gitem .mc{display:flex;gap:4px;flex-wrap:wrap}
.gitem .mc span{font-size:11px;border:1.5px solid var(--ink);border-radius:6px;padding:1px 6px;font-weight:700}
.gitem .mc span.corp{border-color:var(--corp);color:var(--corp)}.gitem .mc span.cons{border-color:var(--cons);color:#c2500a}.gitem .mc span.common{border-color:var(--common);color:var(--common)}
.gitem .mc span.chg{border-color:var(--red);color:var(--red-ink)}
/* 発表モード：画面幅に応じて大きく */
#app.presenting .topbar,#app.presenting .stepper,#app.presenting .actionbar{display:none}
#app.presenting #stage{max-width:none;padding:18px 3vw 30px}
#app.presenting .slide{min-height:calc(100vh - 150px);padding:4vh 4vw;gap:4vw;grid-template-columns:1fr 1.2fr;border-radius:28px}
#app.presenting .slide .eyebrow{font-size:clamp(12px,1.1vw,20px)}
#app.presenting .slide h2{font-size:clamp(34px,4.6vw,84px);line-height:1.2}
#app.presenting .slide .one{font-size:clamp(18px,2vw,36px);line-height:1.55}
#app.presenting .slide .kv{font-size:clamp(15px,1.6vw,28px);gap:1vh 1.2vw}
#app.presenting .slide .kv b{font-size:clamp(12px,1.1vw,20px)}
#app.presenting .slide .kv.crits{font-size:clamp(13px,1.2vw,22px)}
#app.presenting .slide .stars{font-size:clamp(16px,1.5vw,28px)}
#app.presenting .slide .cards .mini{min-height:15vh;padding:1.2vw}
#app.presenting .slide .cards .mini .txt{font-size:clamp(15px,1.5vw,28px)}
#app.presenting .slide .cards .mini .tag,#app.presenting .ccard .tag{font-size:clamp(11px,1vw,18px)}
#app.presenting .ccard .ph{height:clamp(120px,20vh,260px)}
#app.presenting .ccard .ttl{font-size:clamp(20px,2.2vw,40px)}
#app.presenting .ccard .sum{font-size:clamp(13px,1.3vw,24px)}
#app.presenting .slide .arrow{font-size:clamp(28px,3vw,54px)}
#app.presenting .slide .team{font-size:clamp(13px,1.2vw,22px)}
#app.presenting .slide .pageno{font-size:clamp(12px,1.1vw,20px)}
#app.presenting .gallery{grid-template-columns:repeat(auto-fill,minmax(360px,1fr))}
#app.presenting .gitem b{font-size:clamp(18px,1.8vw,30px)}

/* ---------- modal / toast / fx ---------- */
#modalwrap{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(22,32,43,.45);backdrop-filter:blur(4px)}
#modalwrap.open{display:flex}
.modal{background:#fff;border-radius:20px;width:min(720px,100%);max-height:88vh;overflow:auto;box-shadow:var(--shadow-lg);animation:pop .3s var(--spring)}
.modal .mh{display:flex;justify-content:space-between;align-items:center;padding:18px 22px 10px}
.modal .mh h3{font-size:18px}
.modal .mb{padding:6px 22px 18px;color:var(--ink2)}
.modal .mf{display:flex;justify-content:flex-end;gap:8px;padding:8px 22px 20px;flex-wrap:wrap}
.modal.wide{width:min(980px,100%)}
#toasts{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);z-index:120;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-weight:700;font-size:14px;box-shadow:var(--shadow-lg);animation:toastin .35s var(--spring);display:flex;gap:10px;align-items:center;pointer-events:auto}
.toast.ok{background:var(--ok)}
.toast.warn{background:var(--red)}
.toast button{color:var(--hl);text-decoration:underline}
@keyframes toastin{0%{transform:translateY(20px) scale(.9);opacity:0}100%{transform:none;opacity:1}}
#fx{position:fixed;inset:0;pointer-events:none;z-index:90}
.help{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.help .h{padding:12px 14px;border-radius:12px;background:var(--paper2);font-size:13.5px}
.help .h b{display:block;margin-bottom:4px}
.settings h4{margin:18px 0 8px;font-size:14px;color:var(--ink);border-left:4px solid var(--hl);padding-left:8px;display:flex;align-items:center;gap:8px}
.settings h4:first-child{margin-top:4px}
.settings textarea{width:100%;min-height:120px;padding:10px;border:1.5px solid var(--line2);border-radius:10px;font-family:inherit;font-size:12.5px}

@media (max-width:980px){
  .flow{grid-template-columns:repeat(4,1fr)}
  .teamgrid{grid-template-columns:1fr}
  .deckarea{grid-template-columns:1fr}
  .ideaform{grid-template-columns:1fr}
  .slide{grid-template-columns:1fr;padding:24px}
  .slide h2{font-size:28px}
  .topbar .brand small{display:none}
  #app.presenting .slide{grid-template-columns:1fr}
}
@media (max-width:640px){
  .flow{grid-template-columns:repeat(2,1fr)}
  .topbar{gap:8px;padding:8px 10px;flex-wrap:wrap}
  .topbar .brand b{font-size:14px}
  .teamswitch button{padding:4px 9px}
  .stepper{padding:8px 10px}
  .step{min-width:auto;padding:6px 8px}
  .step .l{font-size:12px}
  .step .s{display:none}
  #stage{padding:20px 14px 130px}
  .pagehead h2{font-size:21px}
  .timer .t{font-size:15px;min-width:52px}
  .frame4{grid-template-columns:1fr}
  .sim{grid-template-columns:1fr;gap:6px}
  .sim .pct{text-align:left}
  .table .mini{width:calc(50% - 22px)}
  .table .mini.chg{width:100%}
  .hand{gap:12px}
  .slot{width:min(232px,100%)}
  .deck{width:180px;height:246px}
  .mergebar{width:auto;border-radius:20px;flex-wrap:wrap}
  .actionbar{padding:8px 10px;gap:6px}
  .actionbar .hint{display:none}
  .catdecks{grid-template-columns:1fr 1fr}
  .intro h1 br{display:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
@media print{
  .topbar,.stepper,.actionbar,#fx,#toasts,.pnav,.presbar{display:none!important}
  #stage{padding:0;max-width:none}
  .slide{box-shadow:none;border:1px solid #ccc;page-break-after:always;min-height:auto}
}

","cloud","customer-data"],"articles":[{"title":"今から考えておきたい「デジタル終活」−スマホの中の“見えない契約”で遺された家族が困らないために−","source":"国民生活センター","date":"2024-11-20","url":"https://www.kokusen.go.jp/news/data/n-20241120_1.html","why":"死後のサブスク解約トラブル","tags":[]},{"title":"故人のスマホロック解除に76%が成功、生前の情報共有が鍵に～GOODREI調査","source":"INTERNET Watch（GOODREI調査）","date":"2025-04","url":"https://internet.watch.impress.co.jp/docs/news/2008819.html","why":"遺族のスマホ解錠の実態調査","tags":[]},{"title":"父の死後 突然”督促状” サブスク解約されず退会に約5カ月『デジタル終活』でIDやパスワードの整理を","source":"関西テレビ","date":"2025-04-15","url":"https://www.ktv.jp/news/feature/250415-digital/","why":"サブスク解約遅延の実例","tags":[]}]},{"id":"P4","cat":"pop","title":"若者流出と「関係人口」の争奪","summary":"四国4県は2025年も転出超過が続き、愛媛・高知は転出超過率が全国最高。一方で徳島の移住者は3360人と過去最多となり、二拠点居住・関係人口が新たな受け皿に","shikoku":"2025年国勢調査速報で四国の人口は349万人と全県で減少幅が拡大。愛媛・高知の転出超過率は全国最高、徳島の移住者は3360人で最多","tags":["youth-outflow","population-decline","regional","remote-work","tourism"],"articles":[{"title":"四国4県、25年も転出超過 愛媛・高知は超過率が全国最高","source":"日本経済新聞（総務省 住民基本台帳人口移動報告）","date":"2026-01","url":"https://www.nikkei.com/article/DGXZQOCC3122V0R30C26A1000000/","why":"四国の転出超過が継続","tags":[]},{"title":"四国4県の人口349万人、全県で減少幅が拡大 25年国勢調査","source":"日本経済新聞（2025年国勢調査速報）","date":"2026-05","url":"https://www.nikkei.com/article/DGXZQOCC28D8V0Y6A520C2000000/","why":"四国の人口減少が加速","tags":[]},{"title":"徳島県への移住者、過去最多の3360人 25年度","source":"日本経済新聞","date":"2026-05","url":"https://www.nikkei.com/article/DGXZQOCC29CEB0Z20C26A5000000/","why":"移住・関係人口の増加","tags":[]}]},{"id":"P5","cat":"pop","title":"外国人住民の増加と多言語化","summary":"在留外国人は2025年末に初の400万人超、特定技能が押し上げた。人手不足の製造・介護・農業で定着が進み、多言語の行政・通信・生活サービスが前提条件になる","shikoku":"四国の外国人労働者は2025年10月時点で4万5000人超と最多を更新。今治の造船などで共生が日常化し、4県が定着支援を強化","tags":["foreign-residents","labor-shortage","mobile","regional","smb"],"articles":[{"title":"在留外国人、初の400万人超 人手不足補う「特定技能」が押し上げ","source":"日本経済新聞（出入国在留管理庁）","date":"2026-03","url":"https://www.nikkei.com/article/DGXZQOUA266LJ0W6A320C2000000/","why":"在留外国人が過去最多","tags":[]},{"title":"四国の外国人労働者、4万5000人超えで最多更新 25年秋時点","source":"日本経済新聞（厚労省 外国人雇用状況）","date":"2026-02","url":"https://www.nikkei.com/article/DGXZQOCC043WM0U6A200C2000000/","why":"四国の外国人労働者最多","tags":[]},{"title":"【愛媛】人手不足は好機 造船のまち今治で進むDXや外国人共生の実証実験","source":"日本経済新聞","date":"2026-02","url":"https://www.nikkei.com/article/DGXZQOCC177M00X10C26A2000000/","why":"今治での外国人共生の実証","tags":[]}]},{"id":"P6","cat":"pop","title":"共働き・車頼みの地方子育て","summary":"共働きが標準になる中、学童の待機児童は2025年度1.7万人と高止まり。地方では送迎・習い事・通院が車頼みで、バス減便が親の負担を直撃。移動と居場所の支援が急務","shikoku":"香川の保育所待機児童は2026年度当初1人とほぼ解消だが子どもの数に地域偏りがある。習い事送迎はバス減便で車頼みが一層強まる","tags":["childcare","public-transport","regional","remote-work","labor-shortage"],"articles":[{"title":"学童保育の待機児童なお高止まり 2025年度1.7万人、背景に3つの偏り","source":"日本経済新聞（こども家庭庁）","date":"2025-07","url":"https://www.nikkei.com/article/DGXZQOUA261880W5A720C2000000/","why":"学童待機児童の高止まり","tags":[]},{"title":"子どもの習い事に祖父母の通院…◆バス減便でどう守る？地域の移動手段～「人口消滅」時代を生きる","source":"時事ドットコム","date":"2025-05","url":"https://www.jiji.com/jc/v8?id=202505kurobe-team","why":"減便で送迎が車頼みに","tags":[]},{"title":"香川県の待機児童 2026年度当初は高松市で1人 地域で子どもの数に偏り","source":"KSB瀬戸内海放送（Yahoo!ニュース）","date":"2026-06","url":"https://news.yahoo.co.jp/articles/ba736b0fba6d951ea072a8439d417fa049c2a97b","why":"香川の保育需給の地域偏り","tags":[]}]},{"id":"P7","cat":"pop","title":"老老介護と介護の担い手不足","summary":"2025年、要介護者を介護する同居者の61.9%が65歳以上で老老介護は過去最高。介護事業者倒産も176件と最多で、担い手不足を補う在宅・遠隔支援のニーズが拡大","shikoku":"四国4県の高齢化率は33〜37%と全国上位。高知の過疎地では訪問介護ヘルパー確保のため高校生や移住者に訴求する動きも出ている","tags":["caregiving","elderly","labor-shortage","telemedicine","mimamori"],"articles":[{"title":"65歳以上の「老老介護」61.9％、25年 - 厚労省調査 うち75歳以上37.1％","source":"医療介護CBnews（厚労省 国民生活基礎調査）","date":"2026-07-16","url":"https://www.cbnews.jp/news/entry/20260716115312","why":"老老介護が過去最高","tags":[]},{"title":"2025年「介護事業者」倒産 過去最多の176件 「訪問介護」の倒産が突出、認知症GHも増加","source":"東京商工リサーチ","date":"2026-01","url":"https://www.tsr-net.co.jp/data/detail/1202283_1527.html","why":"介護事業者倒産が最多","tags":[]},{"title":"【高知県の過疎地×訪問介護】将来のヘルパー確保へ 高校生や移住者に訴求","source":"週刊高齢者住宅新聞","date":"2025-07-23","url":"https://www.koureisha-jutaku.com/20250723_03_01/","why":"高知の介護人材確保の現場","tags":[]}]},{"id":"P8","cat":"pop","title":"家族のかたちが多様化する","summary":"2050年に単独世帯は全世帯の44.3%（2330万世帯）へ。未婚・事実婚・同性パートナー・ペット家族が増え、「標準世帯」前提の契約や料金設計の見直しが必要に","shikoku":"高知県は2024年8月にパートナーシップ制度の導入指針を策定し市町村へ展開。四国でも単身や多様な家族を前提にした設計が求められる","tags":["family-diversity","single-household","elderly","customer-data","gov"],"articles":[{"title":"日本の世帯数の将来推計（全国推計）令和6（2024）年推計 －令和2（2020）～32（2050）年－","source":"国立社会保障・人口問題研究所","date":"2024-04-12","url":"https://www.ipss.go.jp/pp-ajsetai/j/HPRJ2024/hprj2024_gaiyo_20240412.pdf","why":"2050年単独世帯44.3%の推計","tags":[]},{"title":"「高知県におけるパートナーシップ制度の導入に関する指針」及び県の取組について","source":"高知県","date":"2026-06","url":"https://www.pref.kochi.lg.jp/doc/2026060100199","why":"四国での多様な家族の制度化","tags":[]},{"title":"犬の飼育数、下げ止まり 飼育率は20、30代で上昇","source":"共同通信（Yahoo!ニュース／ペットフード協会調査）","date":"2025-12","url":"https://news.yahoo.co.jp/articles/6edc2c054afa6bac818333893bb67975921e9962","why":"ペット家族化の若年層拡大","tags":[]}]},{"id":"S1","cat":"soc","title":"運べない物流と置き配標準化","summary":"ドライバー不足は施行2年目も解消せず、人手不足倒産は道路貨物運送業で急増。国交省は置き配を標準サービス化し、送料上昇と配送頻度減が生活の前提になる。","shikoku":"四国は他地域に先駆けてドライバー不足が切迫。愛媛のフジなど中四国スーパー3社を軸に14社が共同配送の研究会を発足した。","tags":["logistics","labor-shortage","population-decline","regional"],"articles":[{"title":"物流2024問題はどうなった？1年経った2025年にトラックドライバーを取材","source":"NHK","date":"2025-04","url":"https://news.web.nhk/newsweb/na/na-k10014770561000","why":"施行1年後の現場実態","tags":[]},{"title":"「置き配」を標準サービスに、国交省がルール改定へ","source":"日本経済新聞","date":"2025-01-07","url":"https://www.nikkei.com/article/DGXZQOUA075UL0X01C25A1000000/","why":"置き配常態化の制度根拠","tags":[]},{"title":"人手不足倒産の動向調査（2025年度上半期）214件で過去最多、道路貨物運送業などで増加","source":"帝国データバンク","date":"2025-10-06","url":"https://www.tdb.co.jp/report/economic/20251006-laborshortage-br25fyh/","why":"運送業で人手不足倒産急増","tags":[]},{"title":"フジ・イズミ・ハローズが共同配送へ連携 2024年問題受け14社で中四国物流研究会","source":"中国新聞","date":"2024-04","url":"https://www.chugoku-np.co.jp/articles/-/457261","why":"中四国スーパーの共同配送","tags":[]}]},{"id":"S2","cat":"soc","title":"後継者不在と静かな廃業","summary":"後継者不在率は50.1%と改善したが、2025年の休廃業・解散は6万7949件と高水準。黒字のまま退出する割合は初めて5割を割り、中小の「静かな退場」が広がる。","shikoku":"四国の休廃業・解散企業は赤字率が初めて5割を超え、2025年の四国4県の倒産も219件と過去10年で最多になった。","tags":["succession","smb","population-decline","regional","finance"],"articles":[{"title":"四国地区・「後継者不在率」動向調査（2025年）","source":"帝国データバンク","date":"2025-12-12","url":"https://www.tdb.co.jp/report/economic/20251212-successor25y-shikoku/","why":"四国の後継者不在の最新値","tags":[]},{"title":"全国「後継者不在率」動向調査（2025年）過去最低の50.1%、「脱ファミリー」経営が加速","source":"帝国データバンク","date":"2025-11-21","url":"https://www.tdb.co.jp/report/economic/20251121-successor25y/","why":"全国不在率50.1%の根拠","tags":[]},{"title":"全国企業「休廃業・解散」動向調査（2025年）6万7949件、黒字休廃業は初の50%割れ","source":"帝国データバンク","date":"2026-01-09","url":"https://www.tdb.co.jp/report/industry/20260109-kyuhaigyo25y/","why":"休廃業6.8万件の根拠","tags":[]},{"title":"四国の休廃業・解散企業 3年ぶり減少 「赤字率」は初めて5割超える","source":"KSB瀬戸内海放送","date":"2026-01","url":"https://news.ksb.co.jp/article/16302661","why":"四国の休廃業の実態","tags":[]}]},{"id":"S3","cat":"soc","title":"縮む公共交通と移動難民","summary":"運転手不足でバス路線の減便・廃止が続き、赤字ローカル線の存廃議論も本格化。車を手放した高齢者の通院・買い物の足が細り、移動そのものが地域課題になる。","shikoku":"四国4県ではバス各社の減便が相次ぎ、JR四国はローカル線の維持が課題。高齢化率3割超の地域で移動手段の確保が急務。","tags":["public-transport","elderly","labor-shortage","population-decline","autonomous"],"articles":[]},{"id":"S4","cat":"soc","title":"地方の中小企業を狙う攻撃","summary":"ランサムウェアとサプライチェーン攻撃が組織向け脅威の上位を占め続け、対策の薄い地方拠点や取引先が踏み台にされる。被害は取引停止や操業停止に直結する。","shikoku":"徳島の町立病院がランサムウェアで2カ月超の診療制限に陥った事例が示す通り、四国の中小・公共機関も標的圏内にある。","tags":["cyber-attack","security","smb","regional","cloud"],"articles":[]},{"id":"S5","cat":"soc","title":"インバウンド分散先としての四国","summary":"訪日客は過去最多を更新し続ける一方、京都など主要都市はオーバーツーリズムが深刻化。万博後は瀬戸内・お遍路・道後など周遊型の地方分散が政策課題になる。","shikoku":"四国の外国人延べ宿泊者数は全国の1%程度にとどまり、4県が連携した周遊ルートづくりと二次交通の整備が伸びしろ。","tags":["tourism","inbound","regional","public-transport","mobile"],"articles":[]},{"id":"S6","cat":"soc","title":"省人化が前提の店舗と現場","summary":"人手不足倒産は2025年度に441件と過去最多を更新。無人店舗やセルフレジ、配膳ロボット、遠隔監視が「省人化ありき」の設計として小売・飲食・製造現場に広がる。","shikoku":"四国は人口減少の先行地域で、店舗・工場・農業現場の省人化投資とそれを支えるネットワーク需要が他地域より早く顕在化する。","tags":["automation","labor-shortage","iot","network","smb"],"articles":[{"title":"人手不足倒産の動向調査（2025年度）441件で過去最多、前年度比1.3倍","source":"帝国データバンク","date":"2026-04-09","url":"https://www.tdb.co.jp/report/economic/20260409-laborshortage-br25fy/","why":"人手不足倒産が過去最多","tags":[]}]},{"id":"S7","cat":"soc","title":"物価高で固定費を見直す家計","summary":"食料品と電気代の高止まりで家計は固定費の見直しに動き、通信費の格安プランへの乗り換えやサブスク解約が進む。企業側も物価高・人件費増で倒産が増える。","shikoku":"2025年の四国4県の倒産は219件と過去10年で最多で、物価高と人件費増が響く。家計も通信・電気のセット節約志向が強まる。","tags":["cost-of-living","energy-price","billing","mobile","smb"],"articles":[{"title":"四国4県の25年倒産219件、過去10年で最多 物価高・人件費増響く","source":"日本経済新聞","date":"2026-01-07","url":"https://www.nikkei.com/article/DGXZQOCC07BI10X00C26A1000000/","why":"四国の物価高倒産の根拠","tags":[]}]},{"id":"S8","cat":"soc","title":"地銀再編とキャッシュレスの日常","summary":"地方銀行は店舗削減と広域連携・統合を進め、窓口はアプリに置き換わる。キャッシュレス決済比率は4割を超え、デジタル給与払いも解禁され現金の役割が縮む。","shikoku":"四国4県に本店を置く地銀8行は人口減で市場が縮み、店舗統廃合と他行連携が進行。地域のスマホ決済対応が生活インフラになる。","tags":["finance","cashless","regional","mobile","population-decline"],"articles":[]},{"id":"T1","cat":"tech","title":"AIエージェントが仕事と家庭に常駐","summary":"生成AIは試行期を過ぎ、自律型AIエージェントが業務手続きや家庭の相談役を担う段階へ。中小企業のAI導入率は2割超で、伴走支援ニーズが広がる。","shikoku":"四国4県の企業の生成AI定期利用率は1年で21%→39%に倍増。一方で社内ルール整備は遅れ、地元ICT企業の伴走支援に商機。","tags":["gen-ai","smb","labor-shortage","regional"],"articles":[{"title":"四国で生成AIの業務利用が急増39％、一方で進まぬ「社内ルール整備」の深刻度","source":"キーマンズネット（ITmedia）","date":"2026-05-27","url":"https://kn.itmedia.co.jp/kn/articles/2605/27/news026.html","why":"四国4県の生成AI利用率調査","tags":[]},{"title":"中小企業のAI等の利活用に係る実態調査（2026年3月）","source":"中小企業基盤整備機構","date":"2026-03","url":"https://www.smrj.go.jp/research_case/questionnaire/fbrion0000002pjw-att/202603_AI_point.pdf","why":"中小企業AI導入率2割超の公的調査","tags":[]},{"title":"2026年はAIエージェントが日本企業の利益に本格貢献する年に","source":"日本経済新聞","date":"2025-02-16","url":"https://www.nikkei.com/article/DGXZQOUB16BQ90W5A211C2000000/","why":"AIエージェント本格化の見通し","tags":[]},{"title":"AIで「トンボ先生」再現 STNetが高知で実証実験","source":"日本経済新聞","date":"2025-02-25","url":"https://www.nikkei.com/article/DGXZQOCC25C8C0V20C25A2000000/","why":"","tags":[]}]},{"id":"T2","cat":"tech","title":"AIデータセンター、地方へ分散","summary":"生成AI需要で電力を大量消費するDCが急増。政府はワット・ビット連携で電力・通信を一体整備し、再エネ豊富な地方への分散立地を推進する。","shikoku":"STNetはAI向けDC拡充を新中期戦略に掲げ、坂出でも他社の新DC計画が進む。香川のGPU専用DCなど四国はAI計算基盤の受け皿候補。","tags":["data-center","gen-ai","renewable","regional","network"],"articles":[{"title":"「ワット・ビット連携官民懇談会取りまとめ1.0」を公表します","source":"経済産業省","date":"2025-06-12","url":"https://www.meti.go.jp/press/2025/06/20250612001/20250612001.html","why":"電力・通信一体でDC地方分散","tags":[]},{"title":"四国電力系のSTNet、AI向けデータセンター拡充へ 新中期戦略","source":"日本経済新聞","date":"2026-03-25","url":"https://www.nikkei.com/article/DGXZQOCC254AF0V20C26A3000000/","why":"STNetのAI向けDC投資方針","tags":[]},{"title":"ELEMENTS CLOUD四国 坂出市内に新データセンター","source":"建通新聞","date":"2025-12","url":"https://digital.kentsu.co.jp/articles/artcl_rglr/01KBKG8H0Q1PVE1W9M7JYJ28FB","why":"香川・坂出への新DC立地","tags":[]},{"title":"経済産業省が「特定重要物資供給確保計画」として認定 ハイレゾ香川による「AI開発用GPU専用データセンター」の立地","source":"香川県","date":"2024","url":"https://www.pref.kagawa.lg.jp/kigyoritti/topics/2024hai.html","why":"","tags":[]}]},{"id":"T3","cat":"tech","title":"電力データが暮らしのセンサーに","summary":"全国のスマートメーター30分値が制度化で自治体・事業者に提供可能に。災害時の在宅推定、空き家推計、高齢者見守りなど社会課題解決への活用が本格化。","shikoku":"四国電力送配電は仁淀川町でスマートメーター通信網を使う見守り実証を実施。四国約270万戸のデータ活用が地域サービスの土台に。","tags":["smart-meter","energy-data","mimamori","akiya","disaster"],"articles":[{"title":"自治体防災業務における電力データ利活用マニュアル（自治体向け）","source":"経済産業省 資源エネルギー庁","date":"2025-05-23","url":"https://www.meti.go.jp/press/2025/05/20250523003/20250523003-1.pdf","why":"防災での電力データ活用の公式指針","tags":[]},{"title":"数時間前の電力データを全国で順次活用し、社会課題を解決","source":"NTTデータ","date":"2025-04-30","url":"https://www.nttdata.com/global/ja/news/topics/2025/043000/","why":"準リアルタイム電力データ提供開始","tags":[]},{"title":"IoT向け通信回線サービスを活用した地域の見守りに係る仁淀川町との実証試験の開始について", ,"tags":[]},{"title":"全国初「運転席無人」自動運転レベル4路線バスを本格運行","source":"伊予鉄グループ","date":"2025-10-27","url":"https://www.iyotetsu.co.jp/sp/topics/press/2025/1027_gbam.pdf","why":"","tags":[]}]},{"id":"T6","cat":"tech","title":"つながる家電、巧妙化する詐欺","summary":"2025年の特殊詐欺・SNS型詐欺被害は過去最悪、ニセ警察やAI活用で手口が高度化。家庭のIoT機器が踏み台となるリスクも増し、認証制度JC-STARが始動。","shikoku":"香川県は2025年の特殊詐欺被害額が33億円超に達し警戒警報を発令。高齢化が進む四国では家庭の通信を守る対策の需要大。","tags":["fraud","iot","security","home-network","elderly"],"articles":[{"title":"ＳＮＳ型投資、ロマンス詐欺被害が過去最悪 「ニセ警察」急増、ＡＩ活用で手口巧妙化も―特殊詐欺・警察庁","source":"時事通信","date":"2026-02-12","url":"https://www.jiji.com/jc/article?k=2026021200462&g=soc","why":"AI悪用で詐欺が高度化、過去最悪","tags":[]},{"title":"香川県が特殊詐欺の警戒警報を発令 被害額33億円超える","source":"KSB瀬戸内海放送","date":"2025-12","url":"https://news.ksb.co.jp/article/16219844","why":"香川の詐欺被害急増と県警報","tags":[]},{"title":"IoT製品に対するセキュリティラベリング制度（JC-STAR）の運用を開始しました","source":"経済産業省","date":"2025-03-25","url":"https://www.meti.go.jp/press/2024/03/20250325007/20250325007.html","why":"IoT機器の安全性認証制度が始動","tags":[]},{"title":"令和7年における特殊詐欺及びSNS型投資・ロマンス詐欺の認知・検挙状況等について（確定値）","source":"警察庁","date":"2026-06-05","url":"https://www.npa.go.jp/bureau/safetylife/sos47/new-topics/260605/01.html","why":"","tags":[]}]},{"id":"T7","cat":"tech","title":"空からつながる衛星・HAPS通信","summary":"スマホと衛星の直接通信が始まり、圏外や災害時でもつながる手段が現実に。2026年にはHAPSの試験サービスも開始し、山間部・離島の通信空白が縮小。","shikoku":"徳島県はKDDIと包括連携し、南海トラフ地震に備えStarlinkやAIドローンを活用した事前防災を推進。山間部・島しょ部の備えが進む。","tags":["satellite","resilience-comm","disaster","mobile","regional"],"articles":[{"title":"徳島県とKDDIが包括連携、南海トラフ巨大地震に備え――KDDI松田社長に聞く「AIドローン」や「Starlink」を活かした事前防災への取り組み","source":"ケータイ Watch（Impress）","date":"2025-07","url":"https://k-tai.watch.impress.co.jp/docs/news/2047399.html","why":"徳島の衛星通信を使う事前防災","tags":[]},{"title":"「空飛ぶ基地局」のHAPS、2026年に日本でプレ商用サービス開始","source":"ソフトバンク","date":"2025-06-26","url":"https://www.softbank.jp/corp/news/press/sbkk/2025/20250626_01/","why":"HAPSが2026年に国内で始動","tags":[]},{"title":"au Starlink Directの衛星データ通信にSamsung GalaxyやGoogle Pixel const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-3);

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const shuffle = arr => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

/* テキスト正規化・類似度 */
const norm = s => String(s || '').normalize('NFKC').toLowerCase().replace(/[\s　・、。，．,\.\-‐–—_/／()（）「」『』【】\[\]"'“”’:：;；!！?？]/g, '');
function bigrams(s) { const set = new Set(); for (let i = 0; i < s.length - 1; i++) set.add(s.slice(i, i + 2)); if (s.length === 1) set.add(s); return set; }
function jaccard(a, b) { if (!a.size || !b.size) return 0; let inter = 0; for (const x of a) if (b.has(x)) inter++; return inter / (a.size + b.size - inter); }
function assetTags(text) { const t = norm(text); const tags = new Set(); for (const k of DATA.keywordDict) { if (t.includes(norm(k.kw))) k.tags.forEach(x => tags.add(x)); } return tags; }
function similarity(a, b) {
  const na = norm(a.text), nb = norm(b.text);
  if (!na || !nb) return 0; if (na === nb) return 1;
  if (na.includes(nb) || nb.includes(na)) return 0.8;
  const j = jaccard(bigrams(na), bigrams(nb));
  const ta = assetTags(a.text), tb = assetTags(b.text);
  let inter = 0; for (const x of ta) if (tb.has(x) && tagW(x) > 0) inter++;
  return Math.min(1, j + (inter >= 2 ? 0.25 : inter === 1 ? 0.1 : 0));
}
function similarPairs(assets, th = 0.34) {
  const out = [];
  for (let i = 0; i < assets.length; i++) for (let j = i + 1; j < assets.length; j++) { const s = similarity(assets[i], assets[j]); if (s >= th) out.push({ a: assets[i], b: assets[j], s }); }
  return out.sort((x, y) => y.s - x.s);
}

/* ===== トースト・モーダル ===== */
function toast(msg, kind = '', action) {
  const wrap = $('#toasts'); const el = document.createElement('div');
  el.className = 'toast ' + kind; el.innerHTML = esc(msg) + (action ? ` <button>${esc(action.label)}</button>` : '');
  if (action) $('button', el).onclick = () => { action.fn(); el.remove(); };
  /* 同じ文言が続いたら差し替え、表示は最大3件まで */
  Array.from(wrap.children).filter(x => x.dataset.msg === msg).forEach(x => x.remove());
  el.dataset.msg = msg; wrap.appendChild(el);
  while (wrap.children.length > 3) wrap.firstChild.remove();
  setTimeout(() => { el.style.transition = 'opacity .4s'; el.style.opacity = '0'; setTimeout(() => el.remove(), 400); }, action ? 5000 : 2400);
}
function modal(html, { wide = false } = {}) {

  w.classList.add('open');

/* ===== 紙吹雪 ===== */
const FX = (() => {
  const cv = document.getElementById('fx'); const ctx = cv.getContext('2d');
  let parts = [], raf = null;
  function resize() { cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio; ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0); }
  addEventListener('resize', resize); resize();
  const COLORS = ['#fff176', '#2962ff', '#e2323f', '#2e9e5b', '#ef9f1a', '#6f4bd8', '#16202b'];
  function burst(x, y, n = 60, spread = 1) {
    if (reduceMotion()) return;
    for (let i = 0; i < n; i++) { const a = Math.random() * Math.PI * 2, v = (2 + Math.random() * 7) * spread; parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 3, g: .18, r: 3 + Math.random() * 4, c: COLORS[i % COLORS.length], rot: Math.random() * 6, vr: (Math.random() - .5) * .3, life: 70 + Math.random() * 40, shape: Math.random() < .5 ? 0 : 1 }); }
    if (!raf) tick();
  }
  function celebrate() { burst(innerWidth * .25, innerHeight * .35, 90, 1.3); setTimeout(() => burst(innerWidth * .75, innerHeight * .35, 90, 1.3), 150); setTimeout(() => burst(innerWidth * .5, innerHeight * .25, 120, 1.6), 300); }
  function tick() {
    ctx.clearRect(0, 0, innerWidth, innerHeight); parts = parts.filter(p => p.life > 0);
    for (const p of parts) { p.x += p.vx; p.y += p.vy; p.vy += p.g; p.vx *= .985; p.rot += p.vr; p.life--; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.globalAlpha = clamp(p.life / 30, 0, 1); ctx.fillStyle = p.c; if (p.shape) ctx.fillRect(-p.r, -p.r * .6, p.r * 2, p.r * 1.2); else { ctx.beginPath(); ctx.arc(0, 0, p.r * .7, 0, 7); ctx.fill(); } ctx.restore(); }
    if (parts.length) raf = requestAnimationFrame(tick); else { raf = null; ctx.clearRect(0, 0, innerWidth, innerHeight); }
  }
  return { burst, celebrate, burstAt(el, n = 50) { if (!el) return; const r = el.getBoundingClientRect(); burst(r.left + r.width / 2, r.top + r.height / 2, n); } };
})();

/* ===== タイマー ===== */
const Timer = (() => {
  let total = 0, left = 0, running = false, iv = null, overNotified = false;
  const fmt = s => { s = Math.max(0, Math.round(s)); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); };
  function set(min) { total = min * 60; left = total; running = false; overNotified = false; clearInterval(iv); iv = null; paint(); }
  function toggle() {
    if (!total) set(S.settings.timerMin || 20);
    if (left <= 0) { left = total; overNotified = false; }
    running = !running;
    if (running) { const t0 = now(), l0 = left; iv = setInterval(() => { left = l0 - (now() - t0) / 1000; if (left <= 0) { left = 0; running = false; clearInterval(iv); iv = null; if (!overNotified) { overNotified = true; toast('時間です。そろそろまとめましょう', 'warn'); } } paint(); }, 250); }
    else { clearInterval(iv); iv = null; }
    paint();
  }
  function reset() { set(total ? total / 60 : (S.settings.timerMin || 20)); }
  function paint() { const el = $('#timer'); if (!el) return; el.classList.toggle('running', running); el.classList.toggle('over', total > 0 && left <= 0); $('.t', el).textContent = fmt(left || total); $('.play', el).textContent = running ? '❚❚' : '▶'; }
  return { set, toggle, reset, paint };
})();

/* ===== 最小QRコード生成（バイトモード・誤り訂正レベルM・バージョン1〜12） ===== */

  };

  const mul = (a, b) => (a && b) ? EXP[(LOG[a] + LOG[b]) % 255] : 0;

  function rs(data, n) { const g = genPoly(n); const res = new Array(n).fill(0); for (const d of data) { const f = d ^ res[0]; res.shift(); res.push(0); if (f) for (let j = 0; j < n; j++) res[j] ^= mul(g[j + 1], f); } return res; }
  function utf8(s) { return Array.from(new TextEncoder().encode(s)); }
  function encode(text) {

function bindTeam() {
  let dept = 'corp';
  $$('#pDept button').forEach(b => b.onclick = () => { dept = b.dataset.v; $$('#pDept button').forEach(x => x.classList.toggle('on', x === b)); });

    const raw = $('#pName').value.trim(); if (!raw) return;
    const names = raw.split(/[、,，\/／\s]+/).filter(Boolean); let n = 0;

    render(); toast(n + '人を追加しました', 'ok'); setTimeout(() => { const i = $('#pName'); if (i) i.focus(); }, 30);

  $('#shuffleTeams').onclick = () => { randomTeams(teamCount); render(); FX.celebrate(); toast('チームを分けました。気になる人は ⇄ で入れ替えられます', 'ok'); };

  $$('.member[data-pid]').forEach(el => el.onclick = e => { if (e.target.closest('button')) return; const p = memberById(el.dataset.pid); if (!p) return; upsertPerson(Object.assign(p, { facilitator: !p.facilitator, teamId: p.facilitator ? p.teamId : null, updatedAt: now() })); render(); });

  const cj = $('#copyJoin'); if (cj) cj.onclick = () => { const i = $('#joinUrl'); copyText(i.value, '参加用リンクをコピーしました'); i.select(); };

function randomTeams(n) {
  const ids = []; for (let i = 0; i < n; i++) ids.push(String.fromCharCode(65 + i));
  ids.forEach(id => ensureTeam(id, S.teams[id] ? S.teams[id].name : 'チーム' + id));
  const pool = S.people.filter(p => !p.facilitator);
  const byDept = {}; pool.forEach(p => (byDept[p.dept] = byDept[p.dept] || []).push(p));
  const groups = Object.values(byDept).map(shuffle).sort((a, b) => b.length - a.length);
  let k = Math.floor(Math.random() * n);
  groups.forEach(g => g.forEach(p => { upsertPerson(Object.assign(p, { teamId: ids[k % n], updatedAt: now() })); k++; }));
  S.people.filter(p => p.facilitator).forEach(p => { if (p.teamId) upsertPerson(Object.assign(p, { teamId: null, updatedAt: now() })); });
  S.activeTeam = ids[0]; save();
}

let kwOff = new Set();
function newsKeywords(t) {
  t = t || T(); const c = t.hand.change ? changeById(t.hand.change) : null; const kws = [];
  if (c) c.tags.filter(tg => tagW(tg) > 0).forEach(tg => kws.push({ tag: tg, from: 'change' }));
  handAssets(t).filter(Boolean).forEach(a => assetTags(a.text).forEach(tg => { if (tagW(tg) > 0 && !kws.some(k => k.tag === tg)) kws.push({ tag: tg, from: 'asset', asset: a.text }); }));
  return kws;
}
function articlePool() {
  const pool = []; const seen = new Set();
  allChanges().forEach(cc => (cc.articles || []).forEach(a => { if (seen.has(a.url)) return; seen.add(a.url); pool.push({ ...a, tags: Array.from(new Set([...(a.tags || []), ...cc.tags])), fromChange: cc.id, cat: cc.cat }); }));
  DATA.assetArticles.forEach(a => { if (seen.has(a.url)) return; seen.add(a.url); pool.push({ ...a, fromChange: null }); });
  return pool;
}
function matchArticles(t) {
  t = t || T(); const c = t.hand.change ? changeById(t.hand.change) : null;
  const active = new Set(newsKeywords(t).filter(k => !kwOff.has(k.tag)).map(k => k.tag));
  const changeTags = new Set(c ? c.tags.filter(x => active.has(x) && tagW(x) > 0) : []);
  const assetTagSet = new Set(); handAssets(t).filter(Boolean).forEach(a => assetTags(a.text).forEach(x => { if (active.has(x) && tagW(x) > 0) assetTagSet.add(x); }));
  const A = [], B = [], C = [];
  for (const a of articlePool()) {
    const cm = Array.from(new Set(a.tags.filter(x => changeTags.has(x)))).sort((p, q) => tagW(q) - tagW(p));
    const am = Array.from(new Set(a.tags.filter(x => assetTagSet.has(x)))).sort((p, q) => tagW(q) - tagW(p));
    const cs = cm.reduce((n, x) => n + tagW(x), 0), as = am.reduce((n, x) => n + tagW(x), 0);
    const fresh = /^2026/.test(a.date) ? 1 : /^2025/.test(a.date) ? 0.5 : 0;
    if (c && a.fromChange === c.id) { A.push({ ...a, score: 100 + fresh, why: [{ t: 'この変化カードの根拠', k: 'chg' }] }); continue; }
    if (cs >= 1.4 && as >= 1.4) { B.push({ ...a, score: cs + as + fresh, why: [{ t: '変化：' + cm.slice(0, 2).map(tagJa).join('・'), k: 'tag' }, { t: 'アセット：' + am.slice(0, 2).map(tagJa).join('・'), k: 'asset' }] }); continue; }
    if (as >= 2.8 || (as >= 1.5 && cs >= 0.8)) { C.push({ ...a, score: as + cs * 0.5 + fresh, why: [{ t: 'アセット：' + am.slice(0, 2).map(tagJa).join('・'), k: 'asset' }].concat(cm.length ? [{ t: '変化：' + cm.slice(0, 1).map(tagJa).join('') , k: 'tag' }] : []) }); }
  }
  const sort = arr => arr.sort((x, y) => y.score - x.score);
  return { A: sort(A).slice(0, 4), B: sort(B).slice(0, 4), C: sort(C).slice(0, 4) };
}

  const canZoom = 'zoom' in s.style;
  if (!app.classList.contains('presenting')) { if (canZoom) s.style.zoom = ''; s.style.transform = ''; return; }
  const top = s.getBoundingClientRect().top; const avail = window.innerHeight - top - 20; if (avail < 200) return;

/* ===== 設定 ===== */
function parseChanges(text) {
  text = text.trim(); if (!text) return [];
  const catOf = s => { s = String(s || '').trim(); const m = { pop: 'pop', soc: 'soc', tech: 'tech', nat: 'nat' }; if (m[s]) return m[s]; if (/人口|世帯/.test(s)) return 'pop'; if (/社会|経済/.test(s)) return 'soc'; if (/科学|技術/.test(s)) return 'tech'; if (/まち|街|自然/.test(s)) return 'nat'; return 'soc'; };
  if (text[0] === '[' || text[0] === '{') { let j = JSON.parse(text); if (!Array.isArray(j)) j = j.changes || j.cards || []; return j.map((c, i) => ({ id: String(c.id || 'C' + (i + 1)), cat: catOf(c.cat || c.category || c.カテゴリ), title: String(c.title || c.タイトル || '').trim(), summary: String(c.summary || c.概要 || '').trim(), shikoku: String(c.shikoku || c.四国 || c.四国の観点 || '').trim(), tags: Array.isArray(c.tags) ? c.tags : Array.from(assetTags((c.title || '') + ' ' + (c.summary || ''))).slice(0, 6), articles: Array.isArray(c.articles) ? c.articles : [] })).filter(c => c.title); }
  const lines = text.split(/\r?\n/).map(l => l.trim()).filter(Boolean); const out = []; let n = 0;
  for (const line of lines) {
    const cols = line.split(/\t|,(?=(?:[^"]*"[^"]*")*[^"]*$)/).map(s => s.replace(/^"|"$/g, '').trim()); if (cols.length < 2) continue;
    if (/^(id|ID|番号)$/.test(cols[0]) || /^(タイトル|title)$/i.test(cols[1]) || /^(タイトル|title)$/i.test(cols[2] || '')) continue;
    let id, cat, title, summary, shikoku;
    if (cols.length >= 3 && /^[A-Za-z]{1,2}\d{1,3}$/.test(cols[0])) { [id, cat, title, summary, shikoku] = cols; } else { n++; id = 'C' + n; [cat, title, summary, shikoku] = cols; }
    if (!title) continue;
    out.push({ id: id || 'C' + (++n), cat: catOf(cat), title, summary: summary || '', shikoku: shikoku || '', tags: Array.from(assetTags(title + ' ' + (summary || ''))).slice(0, 6), articles: [] });
  }
  return out;
}

  const chg = allChanges().find(c => c.id === 'P2') || allChanges()[0];
  setHand(t, { assets: [corp, cons, common].map(a => a ? a.id : null), change: chg ? chg.id : null, updatedAt: now() });
  t.ideas = []; setIdea(t, { id: uid(), createdAt: now(), title: 'よんでん＆ピカラ：おうちの留守番', one: '実家のスマートメーターの電力データと、ピカラ回線につないだ小さな環境センサーで、遠くに住む家族へ「今月も異常なし」を届ける。', who: '都市部に住む子世代／四国の実家に一人で暮らす親', pain: '親の施設入所や逝去で実家が空き家になり、遠方の子は頻繁に見に行けない', how: '電力使用量と温湿度・開閉センサーで異常を検知して通知。草刈りや簡易清掃はグループの地元パートナーが実働する、リアル×デジタルの管理体験。', crit: [4, 5, 4], assets: [corp, cons, common].filter(Boolean).map(a => ({ text: a.text, domain: a.domain })), change: chg ? { id: chg.id, title: chg.title, cat: chg.cat, summary: chg.summary } : null, team: t.name, updatedAt: now() });
  t.draft = null; t.presentIdx = 0; S.step = 'team';
  save(); render(); toast('デモデータを読み込みました。チーム分けから順に見てください', 'ok');
}

/* ===== 起動 ===== */
function boot() {
  const timer = $('#timer'); $('.play', timer).onclick = () => Timer.toggle(); $('.rst', timer).onclick = () => Timer.reset();
  $('#btnSettings').onclick = () => openSettings(); $('#btnHelp').onclick = openHelp;
  $('#syncbadge').onclick = () => { S.step = 'team'; render(); };
  Timer.set(S.settings.timerMin || 20);
  /* 参加用URL：#room=CODE（&r=中継サーバーURL があれば進行役の設定に合わせる） */
  let hp = null; try { hp = new URLSearchParams(location.hash.replace(/^#\/?/, '')); } catch (e) { hp = null; }
  const code = hp && (hp.get('room') || '').replace(/[^A-Za-z0-9]/g, '');
  const rr = hp && (hp.get('r') || hp.get('relay') || '').trim().replace(/\/$/, '');
  if (code && /^https?:\/\//.test(rr || '')) { S.settings.relay = rr; S.settings.relayCustom = rr !== DEFAULT_RELAY; save(); }
  render();
  if (code && code.length >= 4) { history.replaceState(null, '', location.pathname + location.search); joinDialog(code.toUpperCase()); }
  else if (S.room.code && Sync.canUse()) Sync.reopen();
}
boot();

</script>
